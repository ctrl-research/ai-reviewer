name: ego
description: 'A little perspective for your pull requests: LLM-powered pull request review for GitHub and Forgejo/Gitea. Supports Anthropic, OpenAI, and any OpenAI-compatible endpoint (Ollama, vLLM, LM Studio, OpenRouter, etc.).'

inputs:
  platform:
    description: "Forge hosting the pull request: 'github' or 'forgejo' (also covers Gitea). Defaults to 'github'."
    required: false
    default: "github"
  api-url:
    description: "Forge REST API base URL. Defaults to the running forge's API (github.api_url), which works for github.com, GitHub Enterprise Server, and Forgejo/Gitea Actions. Override for self-hosted instances, e.g. https://codeberg.org/api/v1."
    required: false
    default: ${{ github.api_url }}
  provider:
    description: "LLM provider: 'anthropic', 'openai', or 'openai-compatible' (local/self-hosted endpoints)."
    required: false
    default: "anthropic"
  base-url:
    description: "LLM API base URL override. Defaults: anthropic=https://api.anthropic.com, openai=https://api.openai.com/v1. Required for 'openai-compatible' (e.g. http://localhost:11434/v1 for Ollama)."
    required: false
    default: ""
  model:
    description: "Model ID, e.g. 'claude-opus-4-8' (anthropic) or 'llama3.1:70b' (Ollama)."
    required: false
    default: "claude-opus-4-8"
  api-key:
    description: "API key for the LLM provider. Required for cloud providers; optional for local openai-compatible endpoints."
    required: false
    default: ""
  github-token:
    description: "Forge token used to read the PR diff and post the review comment. On GitHub/Forgejo Actions this defaults to the job token."
    required: false
    default: ${{ github.token }}
  pr-number:
    description: "Pull request number. Defaults to the PR from the triggering event."
    required: false
    default: ${{ github.event.pull_request.number }}
  max-tokens:
    description: "Maximum output tokens for the review."
    required: false
    default: "16000"
  max-diff-bytes:
    description: "Truncate the PR diff beyond this many bytes before sending to the LLM."
    required: false
    default: "300000"
  review-prompt:
    description: "Override the default system prompt used for the review."
    required: false
    default: ""
  extra-body:
    description: "JSON object merged into the LLM request body, for provider-specific parameters. A null value removes a key. E.g. '{\"reasoning_split\": true}' for MiniMax, or '{\"max_tokens\": null, \"max_completion_tokens\": 16000}' for newer OpenAI models."
    required: false
    default: ""
  post-comment:
    description: "Post the review as a sticky PR comment ('true'/'false'). The comment is updated in place on subsequent runs."
    required: false
    default: "true"

outputs:
  review:
    description: "The generated review body (markdown)."
    value: ${{ steps.review.outputs.review }}

runs:
  using: "composite"

  # The review itself is done by the ego Go binary (cmd/ego).
  # These steps only obtain the binary and hand it the inputs.
  steps:
    - name: Install ego
      id: install
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        bin_dir="$RUNNER_TEMP/ego"
        mkdir -p "$bin_dir"

        case "${RUNNER_OS:-$(uname -s)}" in
          Linux) os=linux ;;
          macOS|Darwin) os=darwin ;;
          Windows|MINGW*|MSYS*) os=windows ;;
          *) os="" ;;
        esac
        case "${RUNNER_ARCH:-$(uname -m)}" in
          X64|x86_64|amd64) arch=amd64 ;;
          ARM64|arm64|aarch64) arch=arm64 ;;
          *) arch="" ;;
        esac
        ext=""
        [[ "$os" == windows ]] && ext=".exe"
        bin="$bin_dir/ego$ext"
        echo "path=$bin" >> "$GITHUB_OUTPUT"

        # Release tags are bare X.Y.Z and have prebuilt binaries. Any other ref
        # (a branch such as main, or a commit SHA) is built from source.
        if [[ "$ACTION_REF" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && -n "$os" && -n "$arch" ]]; then
          base="https://github.com/ctrl-research/ego/releases/download/$ACTION_REF"
          asset="ego_${os}_${arch}${ext}"
          if curl -fsSL --retry 2 -o "$bin" "$base/$asset" &&
             curl -fsSL --retry 2 -o "$bin_dir/checksums.txt" "$base/checksums.txt"; then
            expected=$(awk -v f="$asset" '$2 == f { print $1 }' "$bin_dir/checksums.txt")
            if command -v sha256sum >/dev/null; then
              actual=$(sha256sum "$bin" | awk '{ print $1 }')
            else
              actual=$(shasum -a 256 "$bin" | awk '{ print $1 }')
            fi
            if [[ -z "$expected" || "$expected" != "$actual" ]]; then
              echo "::error::Checksum verification failed for $asset from release $ACTION_REF."
              exit 1
            fi
            chmod +x "$bin"
            echo "Using prebuilt ego $ACTION_REF ($asset)"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::No prebuilt ego binary for $ACTION_REF ($asset); building from source."
        fi
        echo "build=true" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      if: steps.install.outputs.build == 'true'
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: ${{ github.action_path }}/.tool-versions
        cache: false

    - name: Build ego from source
      if: steps.install.outputs.build == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        BIN: ${{ steps.install.outputs.path }}
        CGO_ENABLED: "0"
      run: go build -trimpath -ldflags "-X main.version=source" -o "$BIN" ./cmd/ego

    - name: Review pull request
      id: review
      shell: bash
      env:
        EGO_BIN: ${{ steps.install.outputs.path }}
        EGO_PLATFORM: ${{ inputs.platform }}
        EGO_API_URL: ${{ inputs.api-url }}
        EGO_REPO: ${{ github.repository }}
        EGO_TOKEN: ${{ inputs.github-token }}
        EGO_PR_NUMBER: ${{ inputs.pr-number }}
        EGO_PROVIDER: ${{ inputs.provider }}
        EGO_BASE_URL: ${{ inputs.base-url }}
        EGO_MODEL: ${{ inputs.model }}
        EGO_API_KEY: ${{ inputs.api-key }}
        EGO_MAX_TOKENS: ${{ inputs.max-tokens }}
        EGO_MAX_DIFF_BYTES: ${{ inputs.max-diff-bytes }}
        EGO_REVIEW_PROMPT: ${{ inputs.review-prompt }}
        EGO_EXTRA_BODY: ${{ inputs.extra-body }}
        EGO_POST_COMMENT: ${{ inputs.post-comment }}
      run: '"$EGO_BIN"'
