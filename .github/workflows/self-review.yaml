name: Self Review
run-name: Self review for ${{ github.event.pull_request.title }}

# Reviews every PR to this repo with the latest *merged* ego (main), never the
# PR's own code.
#
# Security: this uses pull_request_target so that both this workflow file and
# the action come from the base branch. With plain pull_request, GitHub runs the
# workflow from the PR branch, so anyone able to push a branch could edit it to
# print the LLM secrets. pull_request_target runs with secrets and a write
# token, which is only safe because nothing from the PR is ever executed: the
# checkout below is the base commit, and ego reads the diff through the API
# and sends it to the LLM as data. Never check out or run the PR head here.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: self-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs are skipped: they'd be reviewed safely (no PR code runs), but
    # would spend the org's LLM quota on anyone's PR.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged code (base branch)
        uses: actions/checkout@v4.2.2
        with:
          # Explicitly the base branch commit, never the PR head.
          ref: ${{ github.sha }}
          persist-credentials: false

      # MiniMax through its OpenAI-compatible API, using org secrets. To switch
      # back to Anthropic, drop provider/base-url/model and pass
      # api-key: ${{ secrets.ANTHROPIC_API_KEY }}.
      - name: Review with the merged action
        uses: ./
        with:
          provider: openai-compatible
          base-url: ${{ secrets.MINIMAX_API_URL }}
          api-key: ${{ secrets.MINIMAX_API_TOKEN }}
          model: MiniMax-M3
          # Return reasoning in reasoning_content instead of inline <think>
          # tags, which can't be split reliably from the review text.
          extra-body: '{"reasoning_split": true}'
